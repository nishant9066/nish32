<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAJRAITECH LLP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #03050a;
    --text: #ffffff;
    --card: rgba(255,255,255,0.02);
    --border: rgba(0,229,255,0.08);
}

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

/* HEADER FIXED */
header {
    position: fixed;
    width: 100%;
    top: 0;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    backdrop-filter: blur(10px);
    background: rgba(10, 15, 30, 0.7);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
}

/* LEFT LOGO */
.logo {
    font-size: 18px;
    font-weight: 600;
    color: #00e5ff;
}

/* NAV CENTERED PROPERLY */
nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 15px;
}

nav a {
    color: #bbb;
    text-decoration: none;
    font-size: 13px;
    white-space: nowrap;
}

/* THEME BUTTON */
.theme-btn {
    cursor: pointer;
    font-size: 16px;
}

/* HERO */
.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #0a0f25, #000);
    text-align: center;
    padding: 0 20px;
}

.hero h1 {
    font-size: 36px;
}

.highlight {
    color: #00e5ff;
}

/* BUTTONS */
.cta {
    margin-top: 20px;
    display: flex;
    gap: 12px;
}

.btn-primary, .btn-secondary {
    padding: 10px 22px;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.15s;
}

.btn-primary:active, .btn-secondary:active {
    transform: scale(0.95);
}

.btn-primary {
    background: linear-gradient(45deg, #00e5ff, #0077ff);
    border: none;
    color: black;
}

.btn-secondary {
    border: 1px solid #00e5ff;
    color: #00e5ff;
    background: transparent;
}

/* SERVICES */
.section {
    padding: 50px 15px;
    text-align: center;
}

.services {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    margin: 10px;
    padding: 18px;
    width: 90%;
    max-width: 260px;
    border-radius: 10px;
}

/* FORM */
form {
    max-width: 350px;
    margin: auto;
}

input, textarea {
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    background: #0b1224;
    border: 1px solid #1e293b;
    color: white;
}

.submit-btn {
    width: 100%;
    padding: 10px;
    background: linear-gradient(45deg, #00e5ff, #0077ff);
    border: none;
    cursor: pointer;
}

/* LOCATION */
.location {
    padding: 25px 10px;
    text-align: center;
    border-top: 1px solid var(--border);
}

/* FOOTER */
footer {
    padding: 10px;
    text-align: center;
    font-size: 11px;
    color: #666;
}

/* WHATSAPP */
.whatsapp {
    position: fixed;
    bottom: 15px;
    right: 15px;
    background: #25D366;
    padding: 10px;
    border-radius: 50%;
}
</style>
</head>

<body>

<header>
    <div class="logo">VAJRAITECH</div>

    <nav>
        <a href="#">Home</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
        <span class="theme-btn" onclick="toggleTheme()">🌙</span>
    </nav>
</header>

<section class="hero">
    <h1>Building a <span class="highlight">Secure Digital Future</span></h1>

    <div class="cta">
        <button class="btn-primary">Get Protected</button>
        <button class="btn-secondary">Talk to Expert</button>
    </div>
</section>

<section id="services" class="section">
    <h2>Our Services</h2>

    <div class="services">
        <div class="card"><h3>Cybersecurity</h3></div>
        <div class="card"><h3>Network Security</h3></div>
        <div class="card"><h3>IT Support</h3></div>
    </div>
</section>

<section id="contact" class="section">
    <h2>Contact</h2>

    <form action="https://formsubmit.co/nishantveer9066@gmail.com" method="POST">
        <input type="text" name="name" placeholder="Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <textarea name="message" placeholder="Requirement"></textarea>
        <button class="submit-btn">Request Consultation</button>
    </form>

    <p>📞 +91 9767337880</p>
</section>

<section class="location">
    <p>📍 Navi Mumbai, Maharashtra</p>
    <p>🌐 Remote Services Available</p>
</section>

<a class="whatsapp" href="https://wa.me/919767337880">💬</a>

<footer>
    © 2026 VAJRAITECH LLP. All Rights Reserved.
</footer>

<script>
let mode = 0;

function toggleTheme() {
    mode = (mode + 1) % 3;

    if (mode === 0) {
        document.documentElement.style.setProperty('--bg', '#03050a');
        document.documentElement.style.setProperty('--text', '#ffffff');
    } else if (mode === 1) {
        document.documentElement.style.setProperty('--bg', '#ffffff');
        document.documentElement.style.setProperty('--text', '#000000');
    } else {
        document.documentElement.style.setProperty('--bg', '#1f2937');
        document.documentElement.style.setProperty('--text', '#e5e7eb');
    }
}
</script>

</body>
</html>
